<!DOCTYPE html>
<html lang="ES">

<head>
    <!--Nombre de la página-->
    <title>Le Caméléon</title>
    <meta charset="UTF-8">
    <!--Importamos el css de "estilo" para modificar los contenidos de la página principal-->
    <link type="text/css" rel="stylesheet" href="../../css/privado.css" />
    <!--Importamos el css para manejar la fuente del sitio web-->
    <link type="text/css" rel="stylesheet" href="../../css/fuente.css">
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!--Import materialize.css-->
    <link type="text/css" rel="stylesheet" href="../../css/materialize.min.css" media="screen,projection" />
    <!--Importar un icono para el sitio web-->
    <link rel="icon" type="icon/png" href="../../recursos/img/logo_icon.png">
    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <!--Encabezado del sitio web-->
    <header>
    </header>
    <!--Menú de navegación del sitio web-->
    <div class="navbar-fixed" id="menu">
    </div>
    <!--Menú para móviles-->
    <ul class="sidenav" id="mobile">
    </ul>
    <!--Contenido del sitio web-->
    <main>
        <!--Tarjetas de Categorias-->
        <div class="container">
            <div class="row">
                <div class="col s12 m12 l12 xl12" id="titulo_buscador">
                    <h3>Administrar Marcas</h3>
                    <div id="buscador">
                        <nav class="grey lighten-2">
                            <div class="nav-wrapper">
                                <form method="post" id="thesearch">
                                    <div class="input-field">
                                        <input name="buscador_input" id="buscador_input" type="search" required
                                            type="text">
                                    </div>
                                    <button id="boton_buscador" class="tooltipped" data-position="top" data-tooltip="Buscar por nombre"
                                        type="submit"><img src="../../recursos/iconografia/lupa.png" alt="lupa"
                                        height="22"></button>
                                </form>
                            </div>
                        </nav>
                        <a onclick="openCreate()" class="waves-effect waves-light btn modal-trigger boton_verde col s12 m12 l12 xl12">Agregar
                            Marca +</a>
                    </div>
                </div>
                <!-- Modal Agregar Marca -->
                <div id="modal_agregar_marca" class="modal">
                    <div class="modal-content">
                        <form method="post" id="agregar_forms">
                            <div id="titulo_modal2">
                                <div>
                                    <h4>Agregar Marca</h4>
                                </div>
                                <div>
                                    <a class="modal-close waves-effect waves-red btn-flat red darken-2"><img
                                            src="../../recursos/iconografia/cerrar.png" alt="cerrar"></a>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col s4 m4 l4 xl4 subir_imagen">
                                    <div class="imagen_principal">
                                        <img id="imagen_principal" src="../../recursos/iconografia/sin_imagen.png"
                                            alt="imagen">
                                    </div>
                                    <div class="file-field input-field">
                                        <div class="btn">
                                            <span>Imagen Marca</span>
                                            <input id="archivo" name="archivo" type="file" onchange="preliminar(event)">
                                        </div>
                                        <div class="file-path-wrapper">
                                            <input class="file-path validate" type="text">
                                        </div>
                                    </div>
                                </div>
                                <div class="input-field col s8 m8 l8 xl8">
                                    <input id="marca_agregar" name="marca_agregar" type="text" class="validate">
                                    <label class="active" for="first_name2">Nombre Marca</label>
                                </div>
                                <div class="modal-footer boton_agregar_marca">
                                    <button type="submit" class="btn boton_verde">Agregar
                                        Marca</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- Modal Modificar Marca -->
                <div id="editar_modal_marca" class="modal">
                    <div class="modal-content">
                        <form enctype="multipart/form-data" method="post" id="modificar_forms">
                            <div id="titulo_modal2">
                                <div>
                                    <h4>Modificar Marca</h4>
                                </div>
                                <div>
                                    <a href="#!" class="modal-close waves-effect waves-red btn-flat red darken-2"><img
                                            src="../../recursos/iconografia/cerrar.png" alt="cerrar"></a>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col s4 m4 l4 xl4 subir_imagen">
                                    <div class="imagen_principal">
                                        <img id="imagen_principal_modificar" src="../../recursos/iconografia/sin_imagen.png"
                                            alt="imagen">
                                    </div>
                                    <div class="file-field input-field">
                                        <div class="btn">
                                            <span>Imagen Marca</span>
                                            <input id="archivop" name="archivop" type="file" onchange="preliminar2(event)">
                                        </div>
                                        <div class="file-path-wrapper">
                                            <input id="nombrearchivo" name="nombrearchivo" class="file-path validate"
                                                type="text">
                                        </div>
                                    </div>
                                </div>
                                <div class="input-field col col s8 m8 l8 xl8">
                                    <input class="hide" type="number" id="ide" name="ide">
                                    <input id="marca_modificar" name="marca_modificar" type="text" class="validate">
                                    <label class="active" for="first_name2">Nombre Categoria</label>
                                </div>
                                <div class="modal-footer boton_modificar_marca">
                                    <button type="submit" class="waves-effect waves-light btn blue">Modificar
                                        Marca</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- Modal Eliminar Marca -->
                <div id="eliminar_modal_marca" class="modal">
                    <div class="modal-content">
                        <form enctype="multipart/form-data" method="post" id="eliminar_forms">
                            <div id="titulo_modal2">
                                <div>
                                    <h4>Eliminar Marca</h4>
                                </div>
                                <div>
                                    <a class="modal-close waves-effect waves-red btn-flat red darken-2"><img
                                            src="../../recursos/iconografia/cerrar.png" alt="cerrar"></a>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col s4 m4 l4 xl4 subir_imagen">
                                    <div class="imagen_principal">
                                        <img id="imagen_principal_eliminar" src="../../recursos/iconografia/sin_imagen.png" alt="imagen">
                                    </div>
                                    <div class="file-field input-field hide">
                                        <div class="btn">
                                            <span>imagen</span>
                                            <input id="archivoe" name="archivoe" type="file" required disabled>
                                        </div>
                                        <div class="file-path-wrapper">
                                            <input id="namefile" name="namefile" class="file-path validate" type="text"
                                                required disabled>
                                        </div>
                                    </div>
                                </div>
                                <div class="input-field col col s8 m8 l8 xl8">
                                    <input class="hide" type="number" id="ide" name="ide">
                                    <input id="marca_eliminar" name="marca_eliminar" type="text" class="validate"
                                        required disabled>
                                    <label class="active" for="marca_eliminar">Nombre Marca</label>
                                </div>
                                <div class="modal-footer boton_modificar_categoria">
                                    <button type="submit" class="red btn">Eliminar
                                        Marca</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <!--Table-->
            <table class="centered striped teal darken-3 highlight responsive-table" id="tabla">
                <thead>
                    <tr>
                        <th>N° de marca</th>
                        <th>Nombre Marca</th>
                        <th>Imagen Marca</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla_marca">
                </tbody>
            </table>
        </div>
    </main>
    <!--El pie de la página donde colocamos los derechos reservados, algún banner, etc.-->
    <footer>
        <!--Terminos y condiciones-->
        <div id="pie">
            <div>
            </div>
            <div id="texto_terminos">
                <div class="terminos">
                    <p>TÉRMINOS Y CONDICIONES DEL SITIO</p>
                </div>
                <div>
                    <p>Copyright &copy; 2022 Le Caméléon. Todos los derechos reservados</p>
                </div>
            </div>
            <div id="sitio_privado">
                <a href="../../vistas/publico/index.html">Ir a Sitio Web</a>
                <a href="../../vistas/publico/index.html"><img src="../../recursos/iconografia/sitio_publico.png"
                        alt="web" height="45"></a>
            </div>
        </div>
    </footer>
    <!--JavaScript al final del cuerpo para optimizar la carga del sitio-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script type="text/javascript" src="../../recursos/js/materialize.min.js"></script>
    <script type="text/javascript" src="../../recursos/js/sweetalert.min.js"></script>
    <script type="text/javascript" src="../../controladores/componentes.js"></script>
    <script type="text/javascript" src="../../controladores/privado/online.js"></script>
    <script type="text/javascript" src="../../controladores/privado/administrar_marca.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="ES">

<head>
    <!--Nombre de la página-->
    <title>Le Caméléon</title>
    <meta charset="UTF-8">
    <!--Importamos el css de "estilo" para modificar los contenidos de la página principal-->
    <link type="text/css" rel="stylesheet" href="../../css/privado.css" />
    <!--Importamos el css para manejar la fuente del sitio web-->
    <link type="text/css" rel="stylesheet" href="../../css/fuente.css">
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!--Import materialize.css-->
    <link type="text/css" rel="stylesheet" href="../../css/materialize.min.css" media="screen,projection" />
    <!--Importar un icono para el sitio web-->
    <link rel="icon" type="icon/png" href="../../recursos/img/logo_icon.png">
    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <!--Encabezado del sitio web-->
    <header>
    </header>
    <!--Menú de navegación del sitio web-->
    <div class="navbar-fixed" id="menu">
    </div>
    <!--Menú para móviles-->
    <ul class="sidenav" id="mobile">
    </ul>
    <!--Contenido del sitio web-->
    <main>
        <div class="contenedor_perfil">
            <h3>Perfil</h3>
            <form id="perfil_form" name="perfil_form" method="post">
                <div class="nombre_edit_empleado">
                    <p id="nombre_completo_perfil"></p>
                    <a onclick="habilitarEdicion()"><u>Editar Perfil</u><img id="imagen_edit" src="../../recursos/iconografia/editar3.png" alt=""></a>
                </div>
                <div class="datos_empleado">
                    <div class="input-field col s12 m6">
                        <input id="nombre" type="text" placeholder="placeholder" readonly>
                        <label for="nombre">Nombres:</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="apellido" type="text" placeholder="placeholder" readonly>
                        <label for="apellido">Apellidos:</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="telefono" name="telefono" type="text" class="validate" placeholder="placeholder" readonly maxlength="9">
                        <label id="lbtelefono" for="telefono">Teléfono:</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="correo_empleado" name="correo_empleado" class="validate" placeholder="placeholder" type="text" readonly>
                        <label id="lbcorreo" for="correo_empleado">Correo:</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="usuario_empleado" type="text" placeholder="placeholder" readonly>
                        <label for="usuario">Usuario:</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="contra" name="contra" type="password" class="validate" readonly placeholder="placeholder" maxlength="60">
                        <label id="lbcontra" for="contra">Contraseña:</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="confirmar_contra" name="confirmar_contra" type="password" class="validate" placeholder="placeholder" readonly maxlength="60">
                        <label id="lbconfirmar_contra" for="confirmar_contra">Confirmar Contraseña:</label>
                    </div>
                </div>
                <div class="datos_empleado">
                    <div class="input-field col s12 m6">
                        <input id="nit" type="text" readonly>
                        <label for="nit">NIT:</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="dui" type="text" readonly>
                        <label for="dui">DUI:</label>
                    </div>
                </div>
                <div class="modificar_perfil">
                    <button id="boton_perfil" class="btn-small waves-effect waves-blue" type="submit" disabled>Modificar Perfil</button>
                </div>
            </form>
        </div>
    </main>
    <!--El pie de la página donde colocamos los derechos reservados, algún banner, etc.-->
    <footer>
        <!--Terminos y condiciones-->
        <div id="pie">
            <div>
            </div>
            <div id="texto_terminos">
                <div class="terminos">
                    <p>TÉRMINOS Y CONDICIONES DEL SITIO</p>
                </div>
                <div>
                    <p>Copyright &copy; 2022 Le Caméléon. Todos los derechos reservados</p>
                </div>
            </div>
            <div id="sitio_privado">
                <a href="../../vistas/publico/dashboard.html">Ir a Sitio Web</a>
                <a href="../../vistas/publico/dashboard.html"><img src="../../recursos/iconografia/sitio_publico.png"
                        alt="web" height="45"></a>
            </div>
        </div>
    </footer>
    <!--JavaScript al final del cuerpo para optimizar la carga del sitio-->
    <script type="text/javascript" src="../../recursos/js/materialize.min.js"></script>
    <script type="text/javascript" src="../../recursos/js/sweetalert.min.js"></script>
    <script type="text/javascript" src="../../controladores/componentes.js"></script>
    <script type="text/javascript" src="../../controladores/privado/online.js"></script>
    <script type="text/javascript" src="../../controladores/privado/perfil.js"></script>
</body>

</html>

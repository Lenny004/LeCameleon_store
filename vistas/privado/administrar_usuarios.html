<!DOCTYPE html>
<html lang="ES">

<head>
    <!--Nombre de la página-->
    <title>Le Caméléon</title>
    <meta charset="UTF-8">
    <!--Importamos el css de "estilo" para modificar los contenidos de la página principal-->
    <link type="text/css" rel="stylesheet" href="../../css/privado.css" />
    <!--Importamos el css para manejar la fuente del sitio web-->
    <link type="text/css" rel="stylesheet" href="../../css/fuente.css">
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!--Import materialize.css-->
    <link type="text/css" rel="stylesheet" href="../../css/materialize.min.css" media="screen,projection" />
    <!--Importar un icono para el sitio web-->
    <link rel="icon" type="icon/png" href="../../recursos/img/logo_icon.png">
    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <!--Encabezado del sitio web-->
    <header>
    </header>
    <!--Menú de navegación del sitio web-->
    <div class="navbar-fixed" id="menu">
    </div>
    <!--Menú para móviles-->
    <ul class="sidenav" id="mobile">
    </ul>
    <!--Contenido del sitio web-->
    <main>
        <!--Tarjetas de Categorias-->
        <div class="container">
            <div class="row">
                <div class="col s12 m12 l12 xl12" id="titulo_buscador">
                    <h3>Administrar Usuarios</h3>
                    <div id="buscador">
                        <nav class="grey lighten-2">
                            <div class="nav-wrapper">
                                <form method="post" id="thesearch">
                                    <div class="input-field">
                                        <input id="search" name="search" type="search" required>
                                    </div>
                                    <button class="tooltipped" data-position="top" data-tooltip="Buscar por datos del usuario" href=""><img src="../../recursos/iconografia/lupa.png" alt="lupa"
                                        height="22"></button>
                                </form>
                            </div>
                        </nav>
                        <a onclick="openCreate()"
                            class="waves-effect waves-light btn modal-trigger boton_verde col s4 m4 l4 xl4">Agregar
                            Usuario +</a>
                    </div>
                </div>
                <!-- Modal Agregar Usuario -->
                <div id="agregar_modal_usuario" class="modal">
                    <div class="modal-content">
                        <form method="post" id="form_agregar">
                            <div id="titulo_modal2">
                                <div>
                                    <h4>Agregar Usuario</h4>
                                </div>
                                <div>
                                    <a class="modal-close waves-effect waves-red btn-flat red darken-2"><img
                                            src="../../recursos/iconografia/cerrar.png" alt="cerrar"></a>
                                </div>
                            </div>
                            <div class="row">
                                <div class="divider"></div>
                                <div class="col s12 m12 l6 xl6">
                                    <div class="row">
                                        <div class="input-field col s12">
                                            <input id="usuario_e" name="usuario_e" type="text" class="validate" size="70" data-length="70" maxlength="70" required>
                                            <label class="active" for="usuario_e">Usuario:</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="input-field col s12">
                                            <input id="contrasena" name="contrasena" type="password" class="validate" size="60" data-length="60" maxlength="60" required>
                                            <label class="active" for="contrasena">Contraseña:</label>
                                        </div>
                                    </div>  
                                    
                                </div>
                                <div class="col s12 m12 l6 xl6">
                                    <div class="input-field col s12">
                                        <div class="input-field col s12">
                                            <label class="active" for="empleado">Empleado:</label>
                                            <select id="empleado" name="empleado">
                                            </select>
                                        </div>
                                        <div class="input-field col s12">
                                            <label class="active" for="tipo">Tipo usuario:</label>
                                            <select id="tipo" name="tipo">
                                            </select>
                                        </div>
                                        <div class="input-field col s12">
                                            <label class="active" for="estado">Estado usuario:</label>
                                            <select id="estado" name="estado">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col s12 m12 l12 xl12" id="boton_agregar_centrado">
                                    <button type="submit" class=" waves-effect waves-light btn boton_verde">Agregar
                                        Usuario</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- Modal Modificar -->
                <div id="modal_modificar_usuario" class="modal">
                    <div class="modal-content">
                        <form method="post" id="form_modificar">
                            <div id="titulo_modal2">
                                <div>
                                    <h4>Modificar Usuario</h4>
                                </div>
                                <div>
                                    <a href="#!" class="modal-close waves-effect waves-red btn-flat red darken-2"><img
                                            src="../../recursos/iconografia/cerrar.png" alt="cerrar"></a>
                                </div>
                            </div>
                            <div class="row">
                                <div class="divider"></div>
                                <div class="col s12 m12 l6 xl6">
                                    <input class="hide" type="number" id="ide" name="ide">
                                    <div class="row">
                                        <div class="input-field col s12">
                                            <input value="" id="usuarioeM" name="usuarioeM" type="text" class="validate" size="70" data-length="70" maxlength="70" required>
                                            <label class="active" for="usuarioeM">Usuario</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="input-field col s12">
                                            <input id="contrasenaM" name="contrasenaM" type="password" class="validate" class="validate" size="60" data-length="60" maxlength="60" required>
                                            <label for="contrasenaM">Password</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col s12 m12 l6 xl6">
                                    <div class="input-field col s12">
                                        <div class="input-field col s12">
                                            <label class="active" for="empleadoM">Empleado:</label>
                                            <select id="empleadoM" name="empleadoM">
                                            </select>
                                        </div>
                                        <div class="input-field col s12">
                                            <label class="active" for="tipoM">Tipo usuario:</label>
                                            <select id="tipoM" name="tipoM">
                                            </select>
                                        </div>
                                        <div class="input-field col s12">
                                            <label class="active" for="estadoM">Estado usuario:</label>
                                            <select id="estadoM" name="estadoM">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col s12 m12 l12 xl12" id="boton_agregar_centrado">
                                    <button type="submit" class="waves-effect waves-light btn boton_azul">Modificar
                                        Usuario</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- Modal Eliminar -->
                <div id="modal_eliminar_usuario" class="modal">
                    <div class="modal-content">
                        <form method="post" id="form_eliminar">
                            <div id="titulo_modal2">
                                <div>
                                    <h4>Eliminar Usuario</h4>
                                </div>
                                <div>
                                    <a href="#!" class="modal-close waves-effect waves-red btn-flat red darken-2"><img
                                            src="../../recursos/iconografia/cerrar.png" alt="cerrar"></a>
                                </div>
                            </div>
                            <div class="row">
                                <div class="divider"></div>
                                <div class="col s12 m12 l6 xl6">
                                    <input class="hide" type="number" id="ide" name="ide">
                                    <div class="row">
                                        <div class="input-field col s12">
                                            <input value="" id="usuarioD" name="usuarioD" type="text" class="validate" disabled>
                                            <label class="active" for="usuarioD">Usuario</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="input-field col s12">
                                            <input id="contrasenaD" name="contrasenaD" type="password" class="validate" disabled>
                                            <label for="contrasenaD">Password</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col s12 m12 l6 xl6">
                                    <div class="input-field col s12">
                                        <div class="input-field col s12">
                                            <select id="empleadoD" name="empleadoD" disabled>
                                            </select>
                                        </div>
                                        <div class="input-field col s12">
                                            <select id="tipoD" name="tipoD" disabled>
                                            </select>
                                        </div>
                                        <div class="input-field col s12">
                                            <select id="estadoD" name="estadoD" disabled>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col s12 m12 l12 xl12" id="boton_agregar_centrado">
                                    <button type="submit" class="waves-effect red waves-light btn">Eliminar
                                        Usuario</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <!--Table-->
            <table class="centered striped teal darken-3 highlight responsive-table" id="tabla">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Empleado</th>
                        <th>Tipo usuario</th>
                        <th>Estado usuario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <!--Se crea el ID existencias para que este muestre los datos de la tabla que estan en la bd-->
                <tbody id="tbusuarioe"></tbody>
            </table>
        </div>
        </div>
    </main>
    <!--El pie de la página donde colocamos los derechos reservados, algún banner, etc.-->
    <footer>
        <!--Terminos y condiciones-->
        <div id="pie">
            <div>
            </div>
            <div id="texto_terminos">
                <div class="terminos">
                    <p>TÉRMINOS Y CONDICIONES DEL SITIO</p>
                </div>
                <div>
                    <p>Copyright &copy; 2022 Le Caméléon. Todos los derechos reservados</p>
                </div>
            </div>
            <div id="sitio_privado">
                <a href="../../vistas/publico/index.html">Ir a Sitio Web</a>
                <a href="../../vistas/publico/index.html"><img src="../../recursos/iconografia/sitio_publico.png"
                        alt="web" height="45"></a>
            </div>
        </div>
    </footer>
    <!--JavaScript al final del cuerpo para optimizar la carga del sitio-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script type="text/javascript" src="../../recursos/js/materialize.min.js"></script>
    <script type="text/javascript" src="../../recursos/js/sweetalert.min.js"></script>
    <script type="text/javascript" src="../../controladores/componentes.js"></script>
    <script type="text/javascript" src="../../controladores/privado/online.js"></script>
    <script type="text/javascript" src="../../controladores/privado/administrar_usuarios.js"></script>
</body>

</html>

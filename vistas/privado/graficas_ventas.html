<!DOCTYPE html>
<html lang="ES">

<head>
    <!--Nombre de la página-->
    <title>Le Caméléon</title>
    <meta charset="UTF-8">
    <!--Importamos el css de "estilo" para modificar los contenidos de la página principal-->
    <link type="text/css" rel="stylesheet" href="../../css/privado.css" />
    <!--Importamos el css para manejar la fuente del sitio web-->
    <link type="text/css" rel="stylesheet" href="../../css/fuente.css">
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!--Import materialize.css-->
    <link type="text/css" rel="stylesheet" href="../../css/materialize.min.css" media="screen,projection" />
    <!--Importar un icono para el sitio web-->
    <link rel="icon" type="icon/png" href="../../recursos/img/logo_icon.png">
    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <!--Encabezado del sitio web-->
    <header>
    </header>
    <!--Menú de navegación del sitio web-->
    <div class="navbar-fixed" id="menu">
    </div>
    <!--Menú para móviles-->
    <ul class="sidenav" id="mobile">
    </ul>
    <!--Contenido del sitio web-->
    <main>
        <div id="titulo_graficos">
            <h3>Gráficas de Ventas</h3>
        </div>
        <div class="contenedor_graficas">
            <div class="row">
                <div class="col s12">
                    <ul class="tabs">
                        <li class="tab col s3"><a class="active" href="#automaticas">Automáticas</a></li>
                        <li class="tab col s3"><a href="#personalizadas">Personalizadas</a></li>
                        <li class="tab col s3"><a href="#rangos">Rango de fechas</a></li>
                    </ul>
                </div>
                <input class="hide" type="number" id="id" name="id">
                <div id="automaticas">
                    <div class="col s12 m6">
                        <!-- Se muestra un gráfico de barra con la cantidad de productos por categoría -->
                        <canvas id="grafica1"></canvas>
                    </div>
                    <div class="col s12 m6">
                        <!-- Se muestra un gráfico de pastel con el porcentaje de productos por categoría -->
                        <canvas id="grafica2"></canvas>
                    </div>
                    <div class="col s12 m6">
                        <!-- Se muestra un gráfico de pastel con el porcentaje de productos por categoría -->
                        <canvas id="grafica3"></canvas>
                    </div>
                    <div class="col s12 m6">
                        <!-- Se muestra un gráfico de pastel con el porcentaje de productos por categoría -->
                        <canvas id="grafica4"></canvas>
                    </div>
                </div>
                <div id="personalizadas">
                    <form method="post" id="" name="">
                        <div id="opciones_graficas" class="col s12">
                            <div class="input-field col s3 offset-l5 datos_grafica">
                                <select name="filtro" id="filtro" onchange="seleccionFiltro(this.value)">
                                    <option value="" disabled selected>Seleccione un filtro:</option>
                                    <option value="1">Categoría</option>
                                    <option value="2">Subcategoría</option>
                                    <option value="3">Marca</option>
                                    <option value="4">Proveedores</option>
                                </select>
                            </div>
                            <div class="input-field col s3 datos_grafica">
                                <select name="opciones" id="opciones">
                                </select>
                            </div>
                            <button class="btn waves-effect boton_verde waves-light" type="submit" name="action">Generar
                            </button>
                        </div>
                        <div class="col s12 m6">
                            <!-- Se muestra un gráfico de pastel con el porcentaje de productos por categoría -->
                            <canvas id="grafica5"></canvas>
                        </div>
                        <div class="col s12 m6">
                            <!-- Se muestra un gráfico de pastel con el porcentaje de productos por categoría -->
                            <canvas id="grafica6"></canvas>
                        </div>
                    </form>
                </div>
                <div id="rangos">
                    <form method="post" class="z-depth-2">
                        <div id="opciones_graficas" class="col s12">
                            <div class="input-field col s3 offset-l5">
                                <input id="fecha_1" name="fecha_1" type="text" class="datepicker">
                                <label class="active" for="fecha_1">Fecha Inicial:</label>
                            </div>
                            <div class="input-field col s3">
                                <input id="fecha_2" name="fecha_2" type="text" class="datepicker">
                                <label class="active" for="fecha_2">Fecha Final:</label>
                            </div>
                            <button class="btn waves-effect boton_verde waves-light" type="submit" name="action">Generar
                            </button>
                        </div>
                        <div class="col s12 m6">
                            <!-- Se muestra un gráfico de pastel con el porcentaje de productos por categoría -->
                            <canvas id="grafica7"></canvas>
                        </div>
                        <div class="col s12 m6">
                            <!-- Se muestra un gráfico de pastel con el porcentaje de productos por categoría -->
                            <canvas id="grafica8"></canvas>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <!--El pie de la página donde colocamos los derechos reservados, algún banner, etc.-->
    <footer>
        <!--Terminos y condiciones-->
        <div id="pie">
            <div>
            </div>
            <div id="texto_terminos">
                <div class="terminos">
                    <p>TÉRMINOS Y CONDICIONES DEL SITIO</p>
                </div>
                <div>
                    <p>Copyright &copy; 2022 Le Caméléon. Todos los derechos reservados</p>
                </div>
            </div>
            <div id="sitio_privado">
                <a href="../../vistas/publico/dashboard.html">Ir a Sitio Web</a>
                <a href="../../vistas/publico/dashboard.html"><img src="../../recursos/iconografia/sitio_publico.png"
                        alt="web" height="45"></a>
            </div>
        </div>
    </footer>
    <!--JavaScript al final del cuerpo para optimizar la carga del sitio-->
    <script type="text/javascript" src="../../recursos/js/materialize.min.js"></script>
    <script type="text/javascript" src="../../recursos/js/sweetalert.min.js"></script>
    <script type="text/javascript" src="../../controladores/componentes.js"></script>
    <script type="text/javascript" src="../../controladores/privado/online.js"></script>
    <script type="text/javascript" src="../../controladores/privado/graficas_ventas.js"></script>
</body>

</html>

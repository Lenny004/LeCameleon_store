<!DOCTYPE html>
<html lang="ES">

<head>
    <!--Nombre de la página-->
    <title>Le Caméléon</title>
    <meta charset="UTF-8">
    <!--Importamos el css de "estilo" para modificar los contenidos de la página principal-->
    <link type="text/css" rel="stylesheet" href="../../css/privado.css" />
    <!--Importamos el css para manejar la fuente del sitio web-->
    <link type="text/css" rel="stylesheet" href="../../css/fuente.css">
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!--Import materialize.css-->
    <link type="text/css" rel="stylesheet" href="../../css/materialize.min.css" media="screen,projection" />
    <!--Importar un icono para el sitio web-->
    <link rel="icon" type="icon/png" href="../../recursos/img/logo_icon.png">
    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <!--Encabezado del sitio web-->
    <header>
    </header>
    <!--Menú de navegación del sitio web-->
    <div class="navbar-fixed" id="menu">
    </div>
    <!--Menú para móviles-->
    <ul class="sidenav" id="mobile">
    </ul>
    <!--Contenido del sitio web-->
    <main>
        <!--Tarjetas de Categorias-->
        <div class="container">
            <div class="row">
                <div class="col s12 m12 l12 xl12" id="titulo_buscador">
                    <h3>Administrar proveedores</h3>
                    <div id="buscador">
                        <nav class="grey lighten-2">
                            <div class="nav-wrapper">
                                <form method="post" id="thesearch">
                                    <div class="input-field">
                                        <input name="buscador_input" id="buscador_input" type="search" required
                                            type="text">
                                    </div>
                                    <button id="boton_buscador" class="tooltipped" data-position="top" data-tooltip="Buscar por nombre"
                                        type="submit"><img src="../../recursos/iconografia/lupa.png" alt="lupa"
                                        height="22"></button>
                                </form>
                            </div>
                        </nav>
                        <a onclick="openCreate()"
                            class="waves-effect waves-light btn modal-trigger boton_verde col s12 m12 l12 xl12">Agregar
                            Proveedores +</a>
                    </div>
                </div>
                <!-- Modal Agregar -->
                <div id="agregar_modal" class="modal">
                    <div class="modal-content">
                        <form method="post" id="form_agregar">
                            <div id="titulo_modal2">
                                <div>
                                    <h4>Agregar Proveedor</h4>
                                </div>
                                <div>
                                    <a class="modal-close waves-effect waves-red btn-flat red darken-2"><img
                                            src="../../recursos/iconografia/cerrar.png" alt="cerrar"></a>
                                </div>
                            </div>
                            <div class="row">
                                <div class="divider"></div>
                                <div class="col s12 m12 l6 xl6">
                                    <input value="" id="nombre" name="nombre" type="text" class="validate" required>
                                    <label class="active" for="nombre">Nombre del proveedor</label>
                                    <input id="direcion" name="direccion" type="text" class="validate" required>
                                    <label class="active" for="direccion">Dirección proveedor</label>
                                    <input value="" id="telefono" name="telefono" type="text" class="validate"
                                        placeholder="+000-00000000" required>
                                    <label class="active" for="telefono">Teléfono del proveedor</label>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col s12 m12 l12 xl12" id="boton_agregar_centrado">
                                    <button id="boton_agregar" name="boton_agregar" type="submit"
                                        class="waves-effect waves-light btn boton_verde">Agregar
                                        proveedor</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- Modal Modificar -->
                <div id="modificar_modal" class="modal">
                    <div class="modal-content">
                        <form method="post" id="form_modificar">
                            <div id="titulo_modal2">
                                <div>
                                    <h4>Modificar proveedor</h4>
                                </div>
                                <div>
                                    <a class="modal-close waves-effect waves-red btn-flat red darken-2"><img
                                            src="../../recursos/iconografia/cerrar.png" alt="cerrar"></a>
                                </div>
                            </div>
                            <div class="row">
                                <div class="divider"></div>
                                <div class="col s12 m12 l6 xl6">
                                    <input class="hide" type="number" id="ide" name="ide">
                                    <input id="nombreM" name="nombreM" type="text" class="validate" required>
                                    <label class="active" for="nombreM">Nombre del proveedor</label>
                                    <input id="direccionM" name="direccionM" type="text" class="validate" required>
                                    <label class="active" for="direccionM">Dirección proveedor</label>
                                    <input id="telefonoM" name="telefonoM" type="text" placeholder="+000-00000000"
                                        class="validate" required>
                                    <label class="active" for="telefonoM">Teléfono</label>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col s12 m12 l12 xl12" id="boton_agregar_centrado">
                                    <button type="submit" class="waves-effect btn boton_azul">Modificar
                                        proveedor</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- Modal Eliminar -->
                <div id="eliminar_modal" class="modal">
                    <div class="modal-content">
                        <form method="post" id="form_eliminar">
                            <div id="titulo_modal2">
                                <div>
                                    <h4>Eliminar proveedor</h4>
                                </div>
                                <div>
                                    <a class="modal-close waves-effect waves-red btn-flat red darken-2"><img
                                            src="../../recursos/iconografia/cerrar.png" alt="cerrar"></a>
                                </div>
                            </div>
                            <div class="row">
                                <div class="divider"></div>
                                <div class="col s12 m12 l6 xl6">
                                    <input class="hide" type="number" id="ide" name="ide">
                                    <input id="nombreD" name="nombreD" type="text" class="validate" disabled required>
                                    <label class="active" for="nombreD">Nombre del proveedor</label>
                                    <input id="direccionD" name="direccionD" type="text" class="validate" disabled required>
                                    <label class="active" for="direccionD">Dirección del proveedor</label>
                                    <input id="telefonoD" name="telefonoD" type="text" class="validate"
                                        placeholder="+000-00000000" disabled required>
                                    <label class="active" for="telefonoD">Teléfono</label>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col s12 m12 l12 xl12" id="boton_agregar_centrado">
                                    <button type="submit" class="waves-effect red btn">Eliminar
                                        proveedor</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <!--Table-->
            <table class="centered striped teal darken-3 highlight responsive-table" id="tabla">
                <thead>
                    <tr>
                        <th>Nombre proveedor</th>
                        <th>Dirección proveedor</th>
                        <th>Teléfono proveedor</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <!--Se crea el ID existencias para que este muestre los datos de la tabla que estan en la bd-->
                <tbody id="tbproveedor"></tbody>
            </table>
        </div>
        </div>
    </main>
    <!--El pie de la página donde colocamos los derechos reservados, algún banner, etc.-->
    <footer>
        <!--Terminos y condiciones-->
        <div id="pie">
            <div>
            </div>
            <div id="texto_terminos">
                <div class="terminos">
                    <p>TÉRMINOS Y CONDICIONES DEL SITIO</p>
                </div>
                <div>
                    <p>Copyright &copy; 2022 Le Caméléon. Todos los derechos reservados</p>
                </div>
            </div>
            <div id="sitio_privado">
                <a href="../../vistas/publico/index.html">Ir a Sitio Web</a>
                <a href="../../vistas/publico/index.html"><img src="../../recursos/iconografia/sitio_publico.png"
                        alt="web" height="45"></a>
            </div>
        </div>
    </footer>
    <!--JavaScript al final del cuerpo para optimizar la carga del sitio-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script type="text/javascript" src="../../recursos/js/materialize.min.js"></script>
    <script type="text/javascript" src="../../recursos/js/sweetalert.min.js"></script>
    <script type="text/javascript" src="../../controladores/componentes.js"></script>
    <script type="text/javascript" src="../../controladores/privado/online.js"></script>
    <script type="text/javascript" src="../../controladores/privado/administrar_proveedor.js"></script>

</body>

</html>

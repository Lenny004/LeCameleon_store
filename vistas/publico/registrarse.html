<!DOCTYPE html>
<html lang="ES">

<head>
    <!--Importamos el css de "estilo" para modificar los contenidos de la página principal-->
    <link type="text/css" rel="stylesheet" href="../../css/publico.css" />
    <!--Importamos el css para manejar la fuente del sitio web-->
    <link type="text/css" rel="stylesheet" href="../../css/fuente.css">
    <!--Importamos el css para manejar el estilo de nuestra pagina web ya sea containers, etc...-->
    <link type="text/css" rel="stylesheet" href="../../css/Registrarse.css">
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!--Import materialize.css-->
    <link type="text/css" rel="stylesheet" href="../../css/materialize.css" media="screen,projection" />
    <!--Importar un icono para el sitio web-->
    <link rel="icon" type="icon/png" href="../../recursos/img/logo_icon.png">
    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<!--Nombre de la página-->
<title>Le Caméléon</title>

<body>
    <header>
        <div>
            <h1 id="Letras_usuario">Crear Usuario</h1>
        </div>
        <div id="contenedorsito"></div>
    </header>
    <!--Contenido del sitio web-->
    <main>
        <div id="contenedores">
            <div id="nomelacontainer">
                <div class="row">
                    <form class="col s12">
                        <div class="row">
                            <div class="input-field col s6">
                                <input id="first_name" type="text" class="validate">
                                <label for="first_name">Primer Nombre</label>
                            </div>
                            <div class="input-field col s6">
                                <input id="last_name" type="text" class="validate">
                                <label for="last_name">Primer Apellido</label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="input-field col s12">
                                <input id="DUI" type="email" class="">
                                <label for="DUI">DUI</label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="input-field col s12">
                                <input id="telefono" type="email" class="">
                                <label for="telefono">Teléfono</label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="input-field col s12">
                                <input id="email" type="email" class="validate">
                                <label for="email">Correo electronico</label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="input-field col s12">
                                <input id="password" type="password" class="validate">
                                <label for="password">Contraseña</label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="input-field col s12">
                                <input id="password" type="password" class="validate">
                                <label for="password">Confirmar contraseña</label>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="containing">
                <img id="loguito" class="hide-on-med-and-down" src="../../recursos/img/logo_negro.png" alt="">
            </div>
            <div>
                <a id="Boton_registrar" href="" class="btn waves-effect waves-teal">Registrarse</a>
            </div>
        </div>
    </main>

    <!--El pie de la página donde colocamos los derechos reservados, algún banner, etc.-->
    <footer>
        <!--Terminos y condiciones-->
        <div id="pie">
            <div class="terminos">
                <p>TÉRMINOS Y CONDICIONES DEL SITIO</p>
            </div>
            <div>
                <p>Copyright &copy; 2022 Le Caméléon. Todos los derechos reservados</p>
            </div>
        </div>
    </footer>
    <!--JavaScript al final del cuerpo para optimizar la carga del sitio-->
    <script type="text/javascript" src="../js/materialize.min.js"></script>
    <script type="text/javascript" src="../js/index.js"></script>
    <script>
        let menu = document.getElementById("menu");
        window.onscroll = function () {
            if (window.pageYOffset >= 130) {
                menu.classList.add("sticky");
            }
            else {
                menu.classList.remove("sticky");
            }
        }
    </script>
</body>

</html>

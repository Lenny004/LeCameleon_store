<!DOCTYPE html>
<html lang="ES">

<head>
    <!--Importamos el css de "estilo" para modificar los contenidos de la página principal-->
    <link type="text/css" rel="stylesheet" href="../css/renovar_contra.css" />
    <!--Importamos el css para manejar la fuente del sitio web-->
    <link type="text/css" rel="stylesheet" href="../css/fuente.css">
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!--Import materialize.css-->
    <link type="text/css" rel="stylesheet" href="../css/materialize.min.css" media="screen,projection" />
    <!--Importar un icono para el sitio web-->
    <link rel="icon" type="icon/png" href="../recursos/imagenes/logo_icon.png">
    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<!--Nombre de la página-->
<title>Le Caméléon Renovar Contraseña</title>

<body>
    <!--Contenido del sitio web-->
    <section>
        <div id="contenido">
            <div id="logo">
                <img src="../recursos/imagenes/logo_icon2.png" alt="logo">
            </div>
            <div class="card" id="tarjeta_renovar">
                <div class="card-content white-text">
                    <h5>Renovar Contraseña </h5>
                    <li class="divider"></li>
                    <div id="imagen_mensaje">
                        <img src="../recursos/iconografia/restaurar_contra.png" alt="mensaje">
                    </div>
                    <div id="anuncio">
                        <p>Se ha autentificado el código enviado.</p>
                    </div>
                    <div class="input-field">
                        <div id="codigo">
                            <p>Nueva contraseña:</p>
                        </div>
                        <div>
                            <input id="contraseña" type="tel" class="validate" data-length="60">
                        </div>
                    </div>
                    <div class="input-field">
                        <div id="codigo">
                            <p>Confirmar nueva contraseña:</p>
                        </div>
                        <div>
                            <input id="confirmar_contraseña" type="password" class="validate" data-length="60">
                            <span class="helper-text" data-error="contraseñas no coinciden" data-success="contraseñas coinciden"></span>
                        </div>
                    </div>
                </div>
                <div class="card-action" id="boton_renovar">
                    <a class="btn-small waves-effect waves-red" href="../html/login_privado.html">Renovar Contraseña</a>
                </div>
            </div>
        </div>
    </section>
    <!--El pie de la página donde colocamos los derechos reservados, algún banner, etc.-->
    <footer>
        <!--Terminos y condiciones-->
        <div id="pie">
            <div>
            </div>
            <div class="terminos">
                <p>TÉRMINOS Y CONDICIONES DEL SITIO</p>
                <p>Copyright &copy; 2022 Le Caméléon. Todos los derechos reservados</p>
            </div>
            <div id="sitio_privado">
                <a href="../LeCameleon Sitio Web Publico/index.html">Ir a Sitio Web</a>
                <a href="../LeCameleon Sitio Web Publico/index.html"><img src="../recursos/iconografia/sitio_publico.png"
                        alt="web" height="45"></a>
            </div>
        </div>
    </footer>
    <!--JavaScript al final del cuerpo para optimizar la carga del sitio-->
    <script type="text/javascript" src="../js/materialize.min.js"></script>
    <script type="text/javascript" src="../js/renovar_contra.js"></script>
</body>

</html>

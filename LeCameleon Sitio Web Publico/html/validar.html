<!DOCTYPE html>
<html lang="ES">

<head>
    <!--Importamos el css de "estilo" para modificar los contenidos de la página principal-->
    <link type="text/css" rel="stylesheet" href="../css/validar.css" />
    <!--Importamos el css para manejar la fuente del sitio web-->
    <link type="text/css" rel="stylesheet" href="../css/fuente.css">
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!--Import materialize.css-->
    <link type="text/css" rel="stylesheet" href="../css/materialize.min.css" media="screen,projection" />
    <!--Importar un icono para el sitio web-->
    <link rel="icon" type="icon/png" href="../recursos/imagenes/logo_icon.png">
    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<!--Nombre de la página-->
<title>Le Caméléon</title>

<body>
    <!--Contenido del sitio web-->
    <section>
        <div id="contenido">
            <div id="logo">
                <img src="../recursos/imagenes/logo_icon2.png" alt="logo">
            </div>
            <div class="card" id="tarjeta_login">
                <div class="card-content white-text">
                    <h5>Validad usuario</h5>
                    <li class="divider"></li>
                    <div id="imagen_usuario">
                        <img src="../recursos/iconografia/mail_redondo.png" alt="usuario">
                    </div class="col s6 l6">
                    <div class="input-field col s12" id="textod">
                        <label>Se ha enviado un código de acceso a su correo brindado en el apartado anterior. 
                        <br>Por favor, ingresa tu código abajo</label>
                    </div>
                    <div class="input-field col s12" id="codigod">
                        <input  id="codigot" type="text" class="validate">
                        <label for="codigot">Código</label>
                    </div>
                </div>
                <div id="registro">
                    <a href=""><u>¿No tienes un código?<br>Reenviar.</u></a>
                </div>
                <div class="card-action" id="boton_iniciar">
                    <a class="btn-small waves-effect waves-orange" href="../index.html">Iniciar Sesión</a>
                </div>                    
            </div>
        </div>
    </section>
    <!--El pie de la página donde colocamos los derechos reservados, algún banner, etc.-->
    <footer>
        <!--Terminos y condiciones-->
        <div id="pie">
            <div>
            </div>
            <div class="terminos">
                <p>TÉRMINOS Y CONDICIONES DEL SITIO</p>
                <p>Copyright &copy; 2022 Le Caméléon. Todos los derechos reservados</p>
            </div>
            <div>
            </div>
        </div>
    </footer>
    <!--JavaScript al final del cuerpo para optimizar la carga del sitio-->
    <script type="text/javascript" src="../js/materialize.min.js"></script>
</body>

</html>
